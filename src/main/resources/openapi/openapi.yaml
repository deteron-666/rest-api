openapi: 3.0.3
info:
  title: Order Management API
  version: 1.0.0
paths:
  /api/products:
    get:
      summary: Get all products
      operationId: getProducts
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDto'
    post:
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
  /api/products/{productId}:
    get:
      summary: Get product by id
      operationId: getProductById
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
    put:
      summary: Update product
      operationId: updateProduct
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
    delete:
      summary: Delete product
      operationId: deleteProduct
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Product deleted
  /api/orders:
    get:
      summary: Get all orders
      operationId: getOrders
      responses:
        '200':
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderDto'
    post:
      summary: Create an order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDto'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
  /api/orders/{orderId}:
    get:
      summary: Get order by id
      operationId: getOrderById
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
    delete:
      summary: Delete order
      operationId: deleteOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Order deleted
components:
  schemas:
    ProductDto:
      type: object
      required:
        - name
        - price
        - stockQuantity
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
          minimum: 0
        stockQuantity:
          type: integer
          format: int32
          minimum: 0
    OrderItemDto:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
          nullable: true
          readOnly: true
        quantity:
          type: integer
          format: int32
          minimum: 1
        unitPrice:
          type: number
          format: double
          readOnly: true
        totalPrice:
          type: number
          format: double
          readOnly: true
    OrderDto:
      type: object
      required:
        - customerName
        - items
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        customerName:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          default: PENDING
        totalAmount:
          type: number
          format: double
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDto'
