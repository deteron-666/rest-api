openapi: 3.0.3
info:
  title: Order Management API
  version: 1.0.0
  description: API for managing products and customer orders
tags:
  - name: Products
    description: Product catalog operations
  - name: Orders
    description: Customer order operations
  - name: Reports
    description: Sales analytics
paths:
  /api/products:
    get:
      tags: [Products]
      summary: Get all products
      description: Returns a page of products filtered by the optional criteria. The total number of matches is returned in the X-Total-Count header.
      operationId: getProducts
      parameters:
        - in: query
          name: name
          description: Case-insensitive substring of the product name
          schema:
            type: string
            maxLength: 100
        - in: query
          name: minPrice
          schema:
            type: number
            minimum: 0
        - in: query
          name: maxPrice
          schema:
            type: number
            minimum: 0
        - in: query
          name: inStock
          description: true - only products with stock, false - only products without stock
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: List of products
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Get product by id
      operationId: getProductById
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Update product
      description: >
        Replaces the product fields. To avoid overwriting changes made in the meantime (for example, stock
        reserved by a new order), pass the version from the last read: if the product has changed since,
        the update is rejected with 409. Without a version the update overwrites the current values.
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Products]
      summary: Delete product
      description: Existing orders keep the product name and price snapshot, so a product can be deleted even if it was ordered.
      operationId: deleteProduct
      responses:
        '204':
          description: Product deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/orders:
    get:
      tags: [Orders]
      summary: Get all orders
      description: Returns a page of orders filtered by the optional criteria. The total number of matches is returned in the X-Total-Count header.
      operationId: getOrders
      parameters:
        - in: query
          name: customerName
          description: Case-insensitive substring of the customer name
          schema:
            type: string
            maxLength: 100
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Orders list
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderDto'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Orders]
      summary: Create an order
      description: Creates a PENDING order and reserves stock for every item.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDto'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      summary: Get order by id
      operationId: getOrderById
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Orders]
      summary: Delete order
      description: Deletes a PENDING or CANCELLED order. Stock reserved by a PENDING order is returned. PAID orders cannot be deleted.
      operationId: deleteOrder
      responses:
        '204':
          description: Order deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/orders/{orderId}/pay:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      summary: Pay an order
      description: Moves a PENDING order to PAID.
      operationId: payOrder
      responses:
        '200':
          description: Order paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      summary: Cancel an order
      description: Moves a PENDING order to CANCELLED and returns the reserved stock.
      operationId: cancelOrder
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/reports/product-sales:
    get:
      tags: [Reports]
      summary: Top products by revenue
      description: >
        Aggregates order items per product for the period: units sold, number of orders, revenue,
        average unit price, share of the total revenue and current stock. Sorted by revenue descending.
      operationId: getProductSalesReport
      parameters:
        - in: query
          name: from
          description: Start of the period (inclusive), ISO-8601
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          description: End of the period (exclusive), ISO-8601
          schema:
            type: string
            format: date-time
        - in: query
          name: status
          description: Order statuses to include. Defaults to PENDING and PAID (cancelled orders are not sales).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderStatus'
        - in: query
          name: minRevenue
          description: Only products with at least this revenue
          schema:
            type: number
            minimum: 0
        - in: query
          name: limit
          description: Number of top products to return
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Report rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSalesDto'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    ProductId:
      in: path
      name: productId
      required: true
      schema:
        type: integer
        format: int64
    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        type: integer
        format: int64
    Page:
      in: query
      name: page
      description: Zero-based page index
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      in: query
      name: size
      description: Page size
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  headers:
    XTotalCount:
      description: Total number of items matching the filter
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Request is invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >
        Request conflicts with the current state (not enough stock, wrong order status) or the resource
        was modified concurrently; in the latter case the request can be retried after re-reading the resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      description: RFC 9457 problem details
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        errors:
          type: object
          description: Field validation errors, field name to message
          additionalProperties:
            type: string
    ProductDto:
      type: object
      required:
        - name
        - price
        - stockQuantity
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '(?s).*\S.*'
        description:
          type: string
          nullable: true
          maxLength: 500
        price:
          description: Price with at most 2 fraction digits
          type: number
          minimum: 0
          maximum: 1000000000
          x-field-extra-annotation: '@jakarta.validation.constraints.Digits(integer = 10, fraction = 2)'
        stockQuantity:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
        version:
          description: >
            Optimistic locking version, changes on every update of the product, including stock changes by orders.
            Ignored on create. On update, if set, must match the current version, otherwise 409 is returned.
          type: integer
          format: int64
    OrderStatus:
      type: string
      enum:
        - PENDING
        - PAID
        - CANCELLED
    OrderItemDto:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
          nullable: true
          readOnly: true
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
        unitPrice:
          type: number
          readOnly: true
        totalPrice:
          type: number
          readOnly: true
    OrderDto:
      type: object
      required:
        - customerName
        - items
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        customerName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '(?s).*\S.*'
        status:
          description: Read-only. Assigned by the server and changed via the pay and cancel operations.
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
        totalAmount:
          type: number
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderItemDto'
    ProductSalesDto:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        unitsSold:
          type: integer
          format: int64
        ordersCount:
          type: integer
          format: int64
        revenue:
          type: number
        averageUnitPrice:
          type: number
        revenueSharePercent:
          description: Share of the total revenue for the same filter, percent
          type: number
        currentStock:
          description: Current stock, null if the product was deleted from the catalog
          type: integer
          format: int32
          nullable: true
