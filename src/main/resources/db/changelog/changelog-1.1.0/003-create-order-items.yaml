databaseChangeLog:
  - changeSet:
      id: 003-create-order-items
      author: max
      comment: >
        Позиции заказа. Название и цена товара копируются на момент покупки,
        чтобы последующее изменение или удаление товара не меняло историю заказов
      changes:
        - createTable:
            tableName: order_items
            remarks: Позиции заказа со снимком названия и цены товара
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_items
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  remarks: Заказ, к которому относится позиция
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  remarks: Товар на момент покупки. Без внешнего ключа, т.к. товар может быть удалён
                  constraints:
                    nullable: false
              - column:
                  name: product_name
                  type: VARCHAR(100)
                  remarks: Название товара на момент покупки
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
                  remarks: Количество единиц товара
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: DECIMAL(19, 2)
                  remarks: Цена за единицу на момент покупки
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: DECIMAL(19, 2)
                  remarks: Стоимость позиции, unit_price * quantity
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            constraintName: fk_order_items_order
            referencedTableName: orders
            referencedColumnNames: id
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: order_items
            constraintName: fk_order_items_order
        - dropTable:
            tableName: order_items
