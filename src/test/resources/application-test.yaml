spring:
  datasource:
    # Testcontainers JDBC URL: при первом подключении поднимается контейнер postgres:16-alpine
    # (та же версия, что локально). TC_DAEMON=true — один контейнер на весь прогон тестов,
    # он не останавливается при закрытии Spring-контекстов. Данные чистятся в @BeforeEach.
    url: jdbc:tc:postgresql:16-alpine:///rest_api?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    properties:
      hibernate:
        # Статистика Hibernate нужна тестам, которые считают SQL-запросы (защита от N+1)
        generate_statistics: true
logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
