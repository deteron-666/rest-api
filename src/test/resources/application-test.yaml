spring:
  datasource:
    # Своя in-memory база для каждого Spring-контекста тестов
    url: jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    properties:
      hibernate:
        # Статистика Hibernate нужна тестам, которые считают SQL-запросы (защита от N+1)
        generate_statistics: true
logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
