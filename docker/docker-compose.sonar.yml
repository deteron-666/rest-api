# Локальный сервер SonarQube для проверки кода проекта.
#
# Запуск:      docker compose -f docker-compose.sonar.yml up -d
# Интерфейс:   http://localhost:9000 (при первом входе admin / admin, затем сменить пароль)
# Остановка:   docker compose -f docker-compose.sonar.yml down
# Полный сброс (удалить анализы и настройки): docker compose -f docker-compose.sonar.yml down -v
#
# Анализ проекта: см. раздел "Анализ кода в SonarQube" в README.md

name: rest-api-sonar

services:
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: rest-api-sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Встроенный Elasticsearch без mmap: иначе на Linux нужен vm.max_map_count >= 262144 на хосте
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Отдельная база для SonarQube, не связана с базой приложения
  sonarqube-db:
    image: postgres:17-alpine
    container_name: rest-api-sonarqube-db
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:
